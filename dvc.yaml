stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
    - data/raw/dataset.csv
    - src/preprocess.py
    outs:
    - data/processed
  train_model:
    cmd: python src/modeling/train.py
    deps:
    - data/processed/processed.csv
    - src/modeling/train.py
    params:
    - train.epochs
    - train.lr
    - train.test_size
    outs:
    - models/model.pkl
    metrics:
    - metrics/metrics.json:
        cache: false
