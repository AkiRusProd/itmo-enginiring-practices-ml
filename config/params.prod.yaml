# Production profile configuration
# Overrides base params.yaml for production environment
# Uses full resources and conservative parameters

train:
  seed: 42
  test_size: 0.2

models:
  LogisticRegression:
    max_iter: 200
  RandomForest:
    n_estimators: 200  # More trees for better accuracy
    random_state: 42
    n_jobs: -1  # Use all cores
  GradientBoosting:
    n_estimators: 200
    random_state: 42
    learning_rate: 0.05  # Conservative learning rate
  SVC:
    kernel: 'rbf'
    C: 1.0
  DecisionTree:
    max_depth: 15
    random_state: 42
  AdaBoost:
    n_estimators: 100
    random_state: 42
  Bagging:
    n_estimators: 100
    random_state: 42
    n_jobs: -1
